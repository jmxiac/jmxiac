<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caleb Archive</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background: #0b0d14;
            color: white;
            min-height: 100vh;
        }

        .hero {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 25px;
            background:
                linear-gradient(to top, #0b0d14 0%, transparent 70%),
                linear-gradient(135deg, #172235, #0b0d14);
        }

        .small-title {
            letter-spacing: 5px;
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 55px;
            font-weight: normal;
            letter-spacing: 8px;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 15px;
            letter-spacing: 3px;
            opacity: 0.7;
        }

        .content {
            padding: 30px 25px;
        }

        .section-title {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat {
            background: #151925;
            border: 1px solid #282d3d;
            padding: 18px;
            flex: 1;
            text-align: center;
        }

        .stat-number {
            font-size: 25px;
            display: block;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .category {
            padding: 25px 15px;
            background: #151925;
            border: 1px solid #282d3d;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .category:hover {
            background: #202638;
            transform: translateY(-3px);
        }

        .category-icon {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .category-name {
            letter-spacing: 2px;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 50px 20px 30px;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.4;
        }

        @media (min-width: 700px) {
            .hero {
                min-height: 65vh;
                padding: 60px 10%;
            }

            .content {
                max-width: 900px;
                margin: auto;
            }

            h1 {
                font-size: 80px;
            }

            .categories {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="small-title">MY PERSONAL ARCHIVE</div>
        <h1>CALEB</h1>
        <div class="subtitle">LOVE & DEEPSPACE</div>
    </section>

    <main class="content">

        <h2 class="section-title">MY COLLECTION</h2>

        <div class="stats">
            <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">MEMORIES</span>
            </div>

            <div class="stat">
                <span class="stat-number">0</span>
                <span class="stat-label">DATES</span>
            </div>
        </div>

        <div class="categories">

            <div class="category">
                <div class="category-icon">✦</div>
                <div class="category-name">MEMORIES</div>
            </div>

            <div class="category">
                <div class="category-icon">♡</div>
                <div class="category-name">DATES</div>
            </div>

            <div class="category">
                <div class="category-icon">◇</div>
                <div class="category-name">OUTFITS</div>
            </div>

            <div class="category">
                <div class="category-icon">▣</div>
                <div class="category-name">ALBUM</div>
            </div>

        </div>

    </main>

    <footer>
        A PERSONAL CALEB ARCHIVE
    </footer>

</body>
</html>
